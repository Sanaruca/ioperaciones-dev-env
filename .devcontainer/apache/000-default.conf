<VirtualHost *:8080>
    ServerName localhost
    ServerAdmin dev@localhost

    DocumentRoot /workspaces/ioperaciones/public

    <Directory /workspaces/ioperaciones/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Acceso de solo lectura al resto del proyecto (útil para assets fuera de public/)
    <Directory /workspaces/ioperaciones>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Ejemplo de reverse proxy hacia una app Node/bun en el puerto 3000.
    # Descomenta si prefieres servir la app a través de Apache en /app/.
    #ProxyPreserveHost On
    #ProxyPass        /app/ http://127.0.0.1:3000/
    #ProxyPassReverse /app/ http://127.0.0.1:3000/
</VirtualHost>
